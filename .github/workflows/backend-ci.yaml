name: Backend CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  python:
    name: Проверки Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCESS_TEST_DATABASE_URL: postgresql+asyncpg://access_test_app:access_test@127.0.0.1:55432/access_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.7"
          working-directory: backend
      - name: Сгенерировать gRPC-контракт
        run: uv run --locked --all-packages --group codegen python generate_contracts.py
      - name: Запустить тестовый PostgreSQL
        run: docker compose -f ../compose.access-test.yaml up -d --wait --wait-timeout 90
      - name: Проверить поведение
        run: uv run --locked --all-packages pytest
      - name: Проверить формат и стиль
        run: |
          uv run --locked --all-packages ruff check .
          uv run --locked --all-packages ruff format --check .
      - name: Проверить типы
        run: uv run --locked --all-packages mypy .

  compose:
    name: Запуск сервисов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить пароли PostgreSQL для этого запуска
        run: |
          umask 077
          for name in POSTGRES_PASSWORD ACCESS_DB_PASSWORD TASKS_PRINT_DB_PASSWORD SUBMISSIONS_DB_PASSWORD; do
            printf '%s=%s\n' "$name" "$(openssl rand -hex 24)"
          done > .env
      - name: Собрать и запустить сервисы
        run: docker compose up --build --wait --wait-timeout 120
      - name: Проверить HTTP-статусы кабинета
        run: |
          export CABINET_TEST_PASSWORD="$(openssl rand -hex 24)"
          printf '%s\n' "$CABINET_TEST_PASSWORD" | docker compose exec -T access \
            python -m olympiad_access.bootstrap --login test.admin --password-stdin
          python3 frontend/tests/cabinet_pages.py
      - name: Вывести логи при сбое
        if: failure()
        run: docker compose logs --no-color
