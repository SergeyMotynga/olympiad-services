[project]
name = "olympiad-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[dependency-groups]
codegen = ["grpcio-tools>=1.85.3"]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "runtime", "contracts"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]
src = ["services/*/src", "runtime/src", "contracts/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["_pb2(?:_grpc)?[.]pyi?$"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["olympiad_contracts.access_pb2_grpc"]
follow_imports = "silent"
