[project]
name = "olympiad-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "runtime"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/*/src", "runtime/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
