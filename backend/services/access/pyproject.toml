[project]
name = "olympiad-access"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["olympiad-runtime", "olympiad-contracts", "bcrypt==4.3.0"]

[tool.uv.sources]
olympiad-contracts = { workspace = true }
olympiad-runtime = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
