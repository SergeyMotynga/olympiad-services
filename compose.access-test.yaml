name: olympiad-access-tests

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: access_test
      POSTGRES_USER: access_test_app
      POSTGRES_PASSWORD: access_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "access_test_app", "-d", "access_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
