name: olympiad-services

x-backend: &backend
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"]
    interval: 15s
    timeout: 5s
    retries: 10

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Заполни POSTGRES_PASSWORD в .env}"
      ACCESS_DB_PASSWORD: "${ACCESS_DB_PASSWORD:?Заполни ACCESS_DB_PASSWORD в .env}"
      TASKS_PRINT_DB_PASSWORD: "${TASKS_PRINT_DB_PASSWORD:?Заполни TASKS_PRINT_DB_PASSWORD в .env}"
      SUBMISSIONS_DB_PASSWORD: "${SUBMISSIONS_DB_PASSWORD:?Заполни SUBMISSIONS_DB_PASSWORD в .env}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  access:
    <<: *backend
    build:
      context: ./backend
      args:
        SERVICE: access
        APP_MODULE: olympiad_access.main:app
    environment:
      DATABASE_NAME: access
      DATABASE_USER: access_app
      DATABASE_PASSWORD: "${ACCESS_DB_PASSWORD:?Заполни ACCESS_DB_PASSWORD в .env}"
      ACCESS_GRPC_ADDRESS: "0.0.0.0:50051"
    expose: ["50051"]
    ports:
      - "127.0.0.1:8001:8000"

  tasks-print:
    <<: *backend
    build:
      context: ./backend
      args:
        SERVICE: tasks-print
        APP_MODULE: olympiad_tasks_print.main:app
    environment:
      DATABASE_NAME: tasks_print
      DATABASE_USER: tasks_print_app
      DATABASE_PASSWORD: "${TASKS_PRINT_DB_PASSWORD:?Заполни TASKS_PRINT_DB_PASSWORD в .env}"
    ports:
      - "127.0.0.1:8002:8000"

  submissions:
    <<: *backend
    build:
      context: ./backend
      args:
        SERVICE: submissions
        APP_MODULE: olympiad_submissions.main:app
    environment:
      DATABASE_NAME: submissions
      DATABASE_USER: submissions_app
      DATABASE_PASSWORD: "${SUBMISSIONS_DB_PASSWORD:?Заполни SUBMISSIONS_DB_PASSWORD в .env}"
    ports:
      - "127.0.0.1:8003:8000"

volumes:
  pg_data:
