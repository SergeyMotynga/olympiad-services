server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(login|overview)?$ {
        try_files /index.html =404;
    }

    location ~ ^/accounts/?$ {
        auth_request /_check_accounts;
        error_page 401 = @accounts_login;
        error_page 403 =404 /404.html;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location @accounts_login {
        add_header Cache-Control "no-store" always;
        return 302 /login?from=accounts;
    }

    location = /_check_accounts {
        internal;
        proxy_pass http://access:8000/internal/page-access/accounts;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://access:8000/;
    }
}
